server.port=8083
#para persistencia de datos
# spring.datasource.url=jdbc:h2:mem:store
spring.datasource.url=jdbc:h2:file:./data/store
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=metrics,health,info,prometheus
management.endpoint.health.show-details=always
#management.endpoint.metrics.enabled=true
management.metrics.export.prometheus.enabled=true
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
spring.rabbitmq.host=lcoalhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
